baseURL = "https://montenegrodanielfelipe.com/"
defaultContentLanguage = "en"

ignoreLogs = ['warning-goldmark-raw-html']
enableRobotsTXT = true
summaryLength = 0

timeout = "210s"

[pagination]
  pagerSize = 5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[services]
  [services.googleAnalytics]
    ID = "G-QMJW2TPVMJ"

# YouTube embeds use youtube-nocookie.com: no tracking cookies until the visitor plays the video
[privacy]
  [privacy.youtube]
    privacyEnhanced = true