baseURL = "https://montenegrodanielfelipe.com/"
defaultContentLanguage = "en"
timeZone = "America/Bogota"

ignoreLogs = ['warning-goldmark-raw-html']
enableRobotsTXT = true
summaryLength = 0

timeout = "210s"

[pagination]
  pagerSize = 5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[services]
  [services.googleAnalytics]
    ID = "G-QMJW2TPVMJ"

[privacy]
  # Google Analytics does not record visits from browsers that send Do Not Track
  [privacy.googleAnalytics]
    respectDoNotTrack = true
  # YouTube embeds use youtube-nocookie.com: no tracking cookies until the visitor plays the video
  [privacy.youtube]
    privacyEnhanced = true