# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    outputs:
      assistant: ${{ steps.assistant.outputs.sha }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      # Reuse processed images and downloaded modules between runs, so each deploy
      # only processes new or changed images instead of all of them.
      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            resources
          key: hugo-${{ env.HUGO_VERSION }}-${{ github.run_id }}
          restore-keys: hugo-${{ env.HUGO_VERSION }}-
      # baseURL comes from config/_default/hugo.toml (https). The Pages base_url
      # output is http:// for this domain, which leaked into sitemap, og:url and feeds.
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Bogota
        run: |
          hugo \
            --gc \
            --minify
      # The fingerprint of what Roz reads, so her index can tell when the published site
      # is this build and not the one before it (see the roz job below).
      - name: Fingerprint the assistant's index
        id: assistant
        run: echo "sha=$(sha256sum public/assistant/index.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # After each deploy, ask the Internet Archive to keep a copy of the homepage and of
  # /roz-remember/ (everything Roz knows about me), so they outlive this host. Free and
  # anonymous; a failure here never fails the deploy.
  archive:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Save to the Wayback Machine
        run: |
          for url in https://montenegrodanielfelipe.com/ https://montenegrodanielfelipe.com/roz-remember/; do
            curl -s -o /dev/null -w "%{http_code} $url\n" --max-time 120 "https://web.archive.org/save/$url" || true
          done

  # After each deploy, Roz indexes the published site by herself: this starts the "Index
  # Roz" workflow of her repository, which waits until the published /assistant/index.json
  # is the one built above and then re-embeds only what changed. It needs the secret
  # ROZ_INDEX_TOKEN (a fine-grained token limited to her repository, Actions: read and
  # write); without it this job says so and does nothing. A failure here never fails the
  # deploy. Her knowledge files and /roz-remember/ still move by hand: npm run sync, there.
  roz:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    continue-on-error: true
    steps:
      - name: Ask Roz to index the published site
        env:
          TOKEN: ${{ secrets.ROZ_INDEX_TOKEN }}
          EXPECT: ${{ needs.build.outputs.assistant }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::ROZ_INDEX_TOKEN is not set: Roz was not asked to index. Run npm run sync in her repository."
            exit 0
          fi
          curl -fsS --max-time 60 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dafmontenegro/roz/actions/workflows/index.yml/dispatches \
            -d "{\"ref\":\"master\",\"inputs\":{\"expect\":\"$EXPECT\"}}"
          echo "Roz was asked to index (expecting $EXPECT)."
